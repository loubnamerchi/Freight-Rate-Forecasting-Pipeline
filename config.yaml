data:
  raw_path: "data/train-test.csv"
  target_column: "posted_rate"
  id_column: "load_id"
  drop_optional_features: False


paths:
  artifacts: "artifacts/"
  figures: "artifacts/figures/"

  scaler: "artifacts/preprocessing/scaler.joblib"
  preprocessor: "artifacts/preprocessing/preprocessor.pkl"
  feature_engineer: "artifacts/feature_engineering/feature_engineer.pkl"
  feature_names: "artifacts/feature_engineering/feature_names.json"

  processed_train: "data/processed/X_train.parquet"
  processed_val: "data/processed/X_val.parquet"
  processed_test: "data/processed/X_test.parquet"

  processed_y_train: "data/processed/y_train.parquet"
  processed_y_val: "data/processed/y_val.parquet"
  processed_y_test: "data/processed/y_test.parquet"

  validation: "data/validation.csv"
  validation_template: "data/validation-predictions-template.csv"

models:
  - "xgboost"
  - "lightgbm"
  - "random_forest"


training:

  random_state: 42

  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    reg_alpha: 0.0
    reg_lambda: 1.0

  lightgbm:
    n_estimators: 500
    max_depth: -1
    num_leaves: 31
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.0
    reg_lambda: 1.0

  random_forest:
    n_estimators: 500
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"


cross_validation:
  n_splits: 5


optuna:

  enabled: True
  n_trials: 50

  xgboost:

    n_estimators_min: 200
    n_estimators_max: 1000

    max_depth_min: 3
    max_depth_max: 10

    learning_rate_min: 0.01
    learning_rate_max: 0.2

    subsample_min: 0.6
    subsample_max: 1.0

    colsample_bytree_min: 0.6
    colsample_bytree_max: 1.0

    min_child_weight_min: 1
    min_child_weight_max: 10

    reg_alpha_min: 0.0001
    reg_alpha_max: 10.0

    reg_lambda_min: 0.0001
    reg_lambda_max: 10.0


  lightgbm:

    n_estimators_min: 200
    n_estimators_max: 1000

    max_depth_min: 3
    max_depth_max: 12

    num_leaves_min: 15
    num_leaves_max: 100

    learning_rate_min: 0.01
    learning_rate_max: 0.2

    subsample_min: 0.6
    subsample_max: 1.0

    colsample_bytree_min: 0.6
    colsample_bytree_max: 1.0

    min_child_samples_min: 5
    min_child_samples_max: 100

    reg_alpha_min: 0.0001
    reg_alpha_max: 10.0

    reg_lambda_min: 0.0001
    reg_lambda_max: 10.0


  random_forest:

    n_estimators_min: 200
    n_estimators_max: 1000

    max_depth_min: 5
    max_depth_max: 30

    min_samples_split_min: 2
    min_samples_split_max: 20

    min_samples_leaf_min: 1
    min_samples_leaf_max: 10

    max_features_options:
      - "sqrt"
      - "log2"
      - 1.0


artifacts:

  models_dir: "artifacts/models/"
  metrics_dir: "artifacts/metrics/"

  comparison_metrics: "artifacts/metrics/model_comparison.json"

  feature_names: "artifacts/feature_engineering/feature_names.json"

  model_suffix: "_model.joblib"

  validation_predictions: "data/validation_predictions.csv"